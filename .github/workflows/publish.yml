name: Publish

# Publishes to pub.dev when a `v<version>` tag is pushed. pub.dev accepts it
# only from this repository, for tags matching `v{{version}}`, and from the
# `pub.dev` environment (package Admin tab → Automated publishing).
#
# Running it by hand verifies the package archive without publishing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@953e9604f31f14b7fb8d90dd913e6205a6c8eeeb # main, until a v1 release includes test-run
    with:
      environment: pub.dev
      test-run: ${{ github.event_name == 'workflow_dispatch' }}
