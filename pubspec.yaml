name: golden_test
description: "A utility Flutter plugin for writing golden tests that streamlines adding golden tests to your project"
version: 2.0.0
homepage: https://github.com/dmkasperski/golden_test
repository: https://github.com/dmkasperski/golden_test

topics:
  - flutter
  - testing
  - golden-tests
  - ui-testing
  - snapshot-testing

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: lib/fonts/Roboto-Regular.ttf
